<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkBoost – микро-лендинг для товара Wildberries</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .form-block {
      text-align: center;
    }
    input[type="text"] {
      width: 70%;
      padding: 0.5rem;
      font-size: 1rem;
    }
    button {
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      background: #f15a29;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .product {
      display: none; /* скрыто, пока нет товара */
    }
    .product img {
      width: 100%;
      max-width: 400px;
      display: block;
      margin: 0 auto;
    }
    .buy-button {
      display: inline-block;
      background: #f15a29;
      color: white;
      padding: 1rem 2rem;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 1rem;
    }
    .error {
      color: red;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Форма ввода ссылки (видна всегда, если нет товара) -->
  <div id="formBlock" class="form-block">
    <h1>LinkBoost – микро-лендинг для товара Wildberries за минуту</h1>
    <input type="text" id="urlInput" placeholder="Вставьте ссылку на товар Wildberries" />
    <button id="createBtn">Создать</button>
    <p style="color: gray; font-size: 0.9rem;">Пока поддерживаем только Wildberries</p>
  </div>

  <!-- Блок товара (показывается, когда товар загружен) -->
  <div id="productBlock" class="product">
    <p><a href="/" style="color: #f15a29;">← Создать новый лендинг</a></p>
    <img id="productImage" src="" alt="Фото товара" />
    <h2 id="productName"></h2>
    <p>⭐ <span id="productRating"></span> | Отзывов: <span id="productFeedbacks"></span></p>
    <p style="font-size: 2rem; font-weight: bold;"><span id="productPrice"></span> ₽</p>
    <a id="buyLink" href="#" target="_blank" class="buy-button">Купить на Wildberries</a>
    <p style="margin-top: 2rem; color: #666;">Создано через LinkBoost</p>
  </div>

  <!-- Ошибка -->
  <div id="errorBlock" class="error">
    Товар не найден. Проверьте ссылку или попробуйте позже.
  </div>

  <script>
    // Извлекаем ID товара из URL
    function extractProductId(url) {
      const match = url.match(/catalog\/(\d+)\//);
      return match ? match[1] : null;
    }

    // Загружаем данные товара с Wildberries API
    async function loadProduct(id) {
      try {
        const response = await fetch(
          `https://card.wb.ru/cards/v1/detail?appType=1&curr=rub&dest=-1257786&spp=30&nm=${id}`
        );
        const data = await response.json();
        if (data?.data?.products?.length) {
          return data.data.products[0];
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    // Отображаем товар на странице
    function showProduct(product, id) {
      document.getElementById('formBlock').style.display = 'none';
      document.getElementById('productBlock').style.display = 'block';
      document.getElementById('errorBlock').style.display = 'none';

      document.getElementById('productName').textContent = product.name;
      document.getElementById('productRating').textContent = product.rating;
      document.getElementById('productFeedbacks').textContent = product.feedbacks;
      document.getElementById('productPrice').textContent = (product.salePriceU / 100).toFixed(2);
      
      const imageUrl = product.pics.length > 0 
        ? `https://images.wbstatic.net/c516x688/new/${String(product.pics[0]).padStart(6, '0')}.jpg`
        : '';
      document.getElementById('productImage').src = imageUrl;
      document.getElementById('productImage').alt = product.name;
      
      document.getElementById('buyLink').href = `https://www.wildberries.ru/catalog/${id}/detail.aspx`;
    }

    // Показываем ошибку
    function showError() {
      document.getElementById('formBlock').style.display = 'none';
      document.getElementById('productBlock').style.display = 'none';
      document.getElementById('errorBlock').style.display = 'block';
    }

    // Главная функция при загрузке страницы
    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (id) {
        // Если в URL есть ?id=..., загружаем товар
        const product = await loadProduct(id);
        if (product) {
          showProduct(product, id);
          // Обновляем URL, чтобы он был красивым (без перезагрузки)
          window.history.replaceState(null, '', `?id=${id}`);
        } else {
          showError();
        }
      } else {
        // Нет id — показываем форму
        document.getElementById('formBlock').style.display = 'block';
        document.getElementById('productBlock').style.display = 'none';
        document.getElementById('errorBlock').style.display = 'none';
      }
    }

    // Обработчик кнопки «Создать»
    document.getElementById('createBtn').addEventListener('click', function() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url.includes('wildberries.ru')) {
        alert('Ссылка должна быть на Wildberries (wildberries.ru/catalog/...)');
        return;
      }
      const id = extractProductId(url);
      if (id) {
        // Перенаправляемся на эту же страницу с параметром id
        window.location.href = `?id=${id}`;
      } else {
        alert('Не удалось распознать ID товара в ссылке. Пример правильной ссылки: https://www.wildberries.ru/catalog/12345678/detail.aspx');
      }
    });

    // Запускаем инициализацию
    init();
  </script>
</body>
</html>
